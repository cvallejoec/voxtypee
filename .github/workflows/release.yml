# Al empujar un tag vX.Y.Z compila la APK firmada y la publica en Releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Versión desde el tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAYOR MENOR PARCHE <<< "${VERSION%%-*}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODIGO=$((MAYOR * 10000 + MENOR * 100 + PARCHE))" >> "$GITHUB_ENV"

      - name: Llave de firma
        run: echo "${{ secrets.VOXTYPEE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compilar APK
        env:
          VOXTYPEE_KEYSTORE: ${{ runner.temp }}/release.jks
          VOXTYPEE_KEYSTORE_PASSWORD: ${{ secrets.VOXTYPEE_KEYSTORE_PASSWORD }}
          VOXTYPEE_KEY_ALIAS: voxtypee
          VOXTYPEE_KEY_PASSWORD: ${{ secrets.VOXTYPEE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$CODIGO"

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "VoxTypee-$VERSION.apk"
          gh release create "$GITHUB_REF_NAME" "VoxTypee-$VERSION.apk" \
            --title "VoxTypee $VERSION" --generate-notes
